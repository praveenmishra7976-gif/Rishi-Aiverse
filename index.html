<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rishi Aiverse AI Chatbot</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .container {
    width: 90%;
    max-width: 700px;
    background: #111827;
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  #chatBox {
    height: 400px;
    overflow-y: auto;
    border: 1px solid #374151;
    border-radius: 10px;
    padding: 10px;
    background: #1f2937;
    margin-bottom: 10px;
  }

  .msg {
    margin: 10px 0;
    padding: 10px;
    border-radius: 8px;
  }

  .user {
    background: #2563eb;
    text-align: right;
  }

  .bot {
    background: #374151;
  }

  textarea {
    width: 100%;
    height: 80px;
    border-radius: 10px;
    border: none;
    padding: 10px;
    font-size: 16px;
    resize: none;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #4338ca;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Rishi Aiverse AI Chatbot</h1>
  <div id="chatBox"></div>
  <textarea id="prompt" placeholder="Type your message..."></textarea>
  <button onclick="sendMessage()">Send</button>
</div>

<script>
const API_KEY = "PASTE_YOUR_OPENROUTER_API_KEY_HERE";

async function sendMessage() {
  const prompt = document.getElementById("prompt");
  const chatBox = document.getElementById("chatBox");
  const message = prompt.value.trim();

  if (!message) return;

  chatBox.innerHTML += `<div class="msg user">${message}</div>`;
  prompt.value = "";

  chatBox.innerHTML += `<div class="msg bot" id="typing">Thinking...</div>`;
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + API_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        model: "openai/gpt-4o-mini",
        messages: [
          { role: "user", content: message }
        ]
      })
    });

    const data = await response.json();

    document.getElementById("typing").remove();

    const reply =
      data.choices?.[0]?.message?.content ||
      data.error?.message ||
      "No response received.";

    chatBox.innerHTML += `<div class="msg bot">${reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  } catch (error) {
    document.getElementById("typing").remove();
    chatBox.innerHTML += `<div class="msg bot">Error: ${error.message}</div>`;
  }
}
</script>
</body>
</html>
const API_KEY = "sk-or-xxxxxxxxxxxxxxxx";
