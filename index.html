<!DOCTYPE html>
<script>
// IMPORTANT:
// Replace the value below with your NEW OpenRouter API key.
const API_KEY = "YOUR_NEW_OPENROUTER_API_KEY";

const SITE_URL = "https://rishi-aiverse-g8wm.vercel.app";
const SITE_NAME = "Rishi Aiverse";

function addMessage(text, sender) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `message ${sender}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const textarea = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const prompt = textarea.value.trim();

  if (!prompt) return;

  if (!API_KEY || API_KEY === 'YOUR_NEW_OPENROUTER_API_KEY') {
    addMessage('Please add your OpenRouter API key in the code first.', 'bot');
    return;
  }

  addMessage(prompt, 'user');
  textarea.value = '';
  sendBtn.disabled = true;

  const botMessage = addMessage('Thinking...', 'bot');

  try {
    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${API_KEY}`,
        'Content-Type': 'application/json',
        'HTTP-Referer': SITE_URL,
        'X-Title': SITE_NAME
      },
      body: JSON.stringify({
        model: 'openai/gpt-4o-mini',
        messages: [
          {
            role: 'user',
            content: prompt
          }
        ]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      const errorMessage = data?.error?.message || `HTTP ${response.status}`;
      botMessage.textContent = 'Error: ' + errorMessage;
      return;
    }

    const answer = data?.choices?.[0]?.message?.content || 'No response received.';
    botMessage.textContent = answer;
  } catch (error) {
    botMessage.textContent = 'Error: ' + error.message;
  } finally {
    sendBtn.disabled = false;
  }
}

// Send message with Ctrl+Enter
const textarea = document.getElementById('prompt');
textarea.addEventListener('keydown', function(event) {
  if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
    sendMessage();
  }
});
</script>
</body>
</html>
